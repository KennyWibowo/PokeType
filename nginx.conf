server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a static SPA with no router, so a miss is a genuine 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # A sprite for a given dex number never changes, so it can be cached hard.
    location ~* ^/sprites/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # The datasets MUST NOT be immutable. They are bind-mounted and rewritten in
    # place by tools/build-dataset.py, at the same URLs — so a browser told to
    # cache them for 30 days will pair a stale pokemon.json with fresh JS and
    # crash. That happened on 2026-09-11 when abilities were added: Master mode
    # died on `randomOf(attacker.abilities)` for anyone who had loaded the site
    # before. They revalidate instead; they are small and answer 304 cheaply.
    location ~* ^/data/ {
        add_header Cache-Control "no-cache";
    }

    # index.html and the modules must not be cached, or a redeploy leaves
    # browsers on a stale mix of old HTML and new JS.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    access_log off;
}
