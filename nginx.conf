server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a static SPA with no router, so a miss is a genuine 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Sprites and the Pokemon list are content-addressed by the image build:
    # they only change when the stack is redeployed, so cache them hard.
    location ~* ^/(sprites|data)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html and the modules must not be cached, or a redeploy leaves
    # browsers on a stale mix of old HTML and new JS.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    access_log off;
}
